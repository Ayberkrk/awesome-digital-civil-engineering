name: Check list health

on:
  schedule:
    - cron: "0 7 1 * *"
  workflow_dispatch:
    inputs:
      test_issue_step:
        description: Skip the check and exercise the report issue with a sample report
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

jobs:
  health:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Check linked repositories
        id: check
        if: ${{ !inputs.test_issue_step }}
        run: python3 scripts/check_health.py report.md

      - name: Open, update or close the report issue
        if: ${{ !inputs.test_issue_step }}
        run: scripts/report_issue.sh "List health report" "${{ steps.check.outputs.findings }}" report.md

      # Runs the create, update and close paths once against a separate issue,
      # so the real report is never touched.
      - name: Exercise the report issue with a sample report
        if: ${{ inputs.test_issue_step }}
        run: |
          title="List health report (test)"
          printf 'Sample report from a manual test run. Safe to ignore.\n' > sample.md
          scripts/report_issue.sh "$title" 1 sample.md
          printf 'Sample report, second pass.\n' >> sample.md
          scripts/report_issue.sh "$title" 1 sample.md
          scripts/report_issue.sh "$title" 0 sample.md
