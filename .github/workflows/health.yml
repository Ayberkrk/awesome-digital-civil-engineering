name: Check list health

on:
  schedule:
    - cron: "0 7 1 * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  health:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      TITLE: List health report
    steps:
      - uses: actions/checkout@v4

      - name: Check linked repositories
        id: check
        run: python3 scripts/check_health.py report.md

      - name: Open, update or close the report issue
        run: |
          number=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number,title \
            --jq "map(select(.title == \"$TITLE\")) | .[0].number // empty")
          if [ "${{ steps.check.outputs.findings }}" != "0" ]; then
            if [ -n "$number" ]; then
              gh issue edit "$number" --body-file report.md
            else
              gh issue create --title "$TITLE" --body-file report.md
            fi
          elif [ -n "$number" ]; then
            gh issue close "$number" --comment "All entries pass the health check."
          fi
