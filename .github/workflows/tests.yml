name: Test health check

on:
  push:
    branches: [main]
    paths:
      - scripts/**
      - tests/**
      - .github/health-ignore.txt
      - .github/workflows/tests.yml
  pull_request:
    paths:
      - scripts/**
      - tests/**
      - .github/health-ignore.txt
      - .github/workflows/tests.yml

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v
